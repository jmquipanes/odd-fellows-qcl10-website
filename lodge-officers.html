<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quezon City Lodge No. 10 Officers</title>
    <meta
      name="description"
      content="Quezon City Lodge No. 10 Officers"
    />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="container">
      <article class="page">
        <header>
          <h1>Quezon City Lodge No. 10 Officers</h1>
          <p class="lead">
            Meet the leadership of our lodge
          </p>
        </header>

        <section class="officers-grid">
          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Ralph NG.jpg" alt="Noble Grand" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Ralph Eleazer Monteser</h3>
              <p class="officer-position">Noble Grand</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro RC VG.jpg" alt="Vice Grand" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. R.C. Jucan Bautista</h3>
              <p class="officer-position">Vice Grand</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Persi.jpg" alt="Secretary" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Persival Santiago</h3>
              <p class="officer-position">Secretary</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Ronald Allan Babas.jpg" alt="Financial Secretary" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Ronald Allan Babas</h3>
              <p class="officer-position">Financial Secretary</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Henrik.jpg" alt="Treasurer" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Henrik San Diego</h3>
              <p class="officer-position">Treasurer</p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <div id="footer-placeholder"></div>
    <script src="shared.js"></script>
  </body>
</html>
