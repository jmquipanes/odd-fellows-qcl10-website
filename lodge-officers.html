<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quezon City Lodge No. 10 Officers</title>
    <meta
      name="description"
      content="Quezon City Lodge No. 10 Officers"
    />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="container">
      <article class="page">
        <header>
          <h1>Quezon City Lodge No. 10 Officers</h1>
          <p class="lead">
            Meet the leadership of our lodge
          </p>
        </header>

        <section class="officers-grid">
          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Ralph NG.jpg" alt="Officer name" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Ralph Eleazer Monteser</h3>
              <p class="officer-position">Noble Grand</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro RC VG.jpg" alt="Officer name" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. R.C. Jucan Bautista</h3>
              <p class="officer-position">Vice Grand</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect fill='%23e0e0e0' width='200' height='200'/%3E%3Ccircle cx='100' cy='60' r='30' fill='%23999'/%3E%3Cpath d='M70 120 Q70 90 100 90 Q130 90 130 120 L130 180 Q130 200 100 200 Q70 200 70 180 Z' fill='%23999'/%3E%3C/svg%3E" alt="Bro. Persival Santiago" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Persival Santiago</h3>
              <p class="officer-position">Secretary</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="assets/pics/Bro Ronald Allan Babas.jpg" alt="Officer name" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Ronald Allan Babas</h3>
              <p class="officer-position">Financial Secretary</p>
            </div>
          </div>

          <div class="officer-card">
            <div class="officer-image">
              <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect fill='%23e0e0e0' width='200' height='200'/%3E%3Ccircle cx='100' cy='60' r='30' fill='%23999'/%3E%3Cpath d='M70 120 Q70 90 100 90 Q130 90 130 120 L130 180 Q130 200 100 200 Q70 200 70 180 Z' fill='%23999'/%3E%3C/svg%3E" alt="Bro. Henrik San Diego" />
            </div>
            <div class="officer-info">
              <h3 class="officer-name">Bro. Henrik San Diego</h3>
              <p class="officer-position">Treasurer</p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <div id="footer-placeholder"></div>
    <script src="shared.js"></script>
  </body>
</html>
